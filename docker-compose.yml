services:
  db:
    # PostgreSQL 15 加上 pgvector 向量擴充
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?請在 .env 設定 DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://travel:${DB_PASSWORD}@db:5432/travel
      STAFF_TOKEN: ${STAFF_TOKEN:?請在 .env 設定 STAFF_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-claude-haiku-5-5}
      DAILY_CHAT_LIMIT: ${DAILY_CHAT_LIMIT:-200}
      DAILY_COST_LIMIT_USD: ${DAILY_COST_LIMIT_USD:-1.00}
      MANAGER_TOKEN: ${MANAGER_TOKEN:?請在 .env 設定 MANAGER_TOKEN}
      PARTNER_DEMO_KEY: ${PARTNER_DEMO_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      SALES_PASSWORD: ${SALES_PASSWORD:-}
      PROCUREMENT_MODEL: ${PROCUREMENT_MODEL:-claude-opus-5-5}
      MANAGER_APPROVAL_THRESHOLD: ${MANAGER_APPROVAL_THRESHOLD:-30000}
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:?請在 .env 設定 AUTOMATION_TOKEN}
      N8N_WEBHOOK_BASE: http://n8n:5678
      ERP_URL: http://erp:8000
      ERP_API_KEY: ${ERP_API_KEY:?請在 .env 設定 ERP_API_KEY}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RAG_MODEL: ${RAG_MODEL:-finetuned}
      OPENDATA_AUTO_IMPORT: ${OPENDATA_AUTO_IMPORT:-1}
      SUPPLIER_URL: http://supplier:8000
    depends_on:
      db:
        condition: service_healthy
      erp:
        condition: service_started
    ports: ["${APP_PORT:-8100}:8000"]
    restart: unless-stopped
  # 模擬系統商的 ERP，另一個獨立服務
  erp:
    build:
      context: .
      dockerfile: erp/Dockerfile
    environment:
      ERP_API_KEY: ${ERP_API_KEY:?請在 .env 設定 ERP_API_KEY}
    volumes:
      - erpdata:/data
    ports: ["${ERP_PORT:-8101}:8000"]
    restart: unless-stopped
  # 模擬官網：另一套系統，由後端帶 API 金鑰呼叫合作夥伴 API
  website:
    build:
      context: .
      dockerfile: website/Dockerfile
    environment:
      PARTNER_API: http://app:8000/partner
      PARTNER_KEY: ${PARTNER_DEMO_KEY:-}
    depends_on: [app]
    ports: ["${WEBSITE_PORT:-8103}:8000"]
    restart: unless-stopped
  # 模擬供應商網站：給爬蟲抓的對象（分頁、robots.txt、限流、每天變價），只開在本機
  supplier:
    build:
      context: .
      dockerfile: supplier/Dockerfile
    ports: ["127.0.0.1:${SUPPLIER_PORT:-8104}:8000"]
    restart: unless-stopped
  # MCP 伺服器：讓 Claude Desktop／Claude Code 直接操作本系統，只開在本機
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    environment:
      TRAVEL_API: http://app:8000
    depends_on: [app]
    ports: ["127.0.0.1:${MCP_PORT:-8102}:8000"]
    restart: unless-stopped
  # 模擬信箱：n8n 寄的信都會到這裡（不會真的寄出去），收件畫面只開在本機
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["127.0.0.1:${MAIL_UI_PORT:-8025}:8025"]
    restart: unless-stopped
  # n8n 自動化：通知、每日報表、採購提醒、同步失敗重試。編輯畫面只開在本機。
  n8n:
    image: n8nio/n8n:2.45.7
    entrypoint: ["/bin/sh", "/automation/start-n8n.sh"]
    environment:
      GENERIC_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
      APP_URL: http://app:8000
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:?請在 .env 設定 AUTOMATION_TOKEN}
      MAILPIT_URL: http://mailpit:8025
      SITE_URL: http://localhost:${APP_PORT:-8100}
      SALES_EMAIL: ${SALES_EMAIL:-sales@travel.example}
      MANAGER_EMAIL: ${MANAGER_EMAIL:-manager@travel.example}
      IT_EMAIL: ${IT_EMAIL:-it@travel.example}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./automation:/automation:ro
    ports: ["127.0.0.1:${N8N_PORT:-5678}:5678"]
    restart: unless-stopped
  # 監控：Prometheus 收集指標並判斷告警 → Alertmanager 寄告警信到模擬信箱 → Grafana 畫成圖。只開在本機。
  prometheus:
    image: prom/prometheus:v2.55.1
    entrypoint: ["/bin/sh", "/etc/prometheus/start.sh"]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?請在 .env 設定 METRICS_TOKEN}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/start.sh:/etc/prometheus/start.sh:ro
      - promdata:/prometheus
    depends_on: [app]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager   # 不寫的話 Docker 會建一個名稱是亂碼的資料區
    depends_on: [mailpit]
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?請在 .env 設定 GRAFANA_PASSWORD}
      GF_USERS_DEFAULT_LANGUAGE: zh-Hant
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/travel.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    restart: unless-stopped
volumes:
  dbdata:
  erpdata:
  n8ndata:
  promdata:
  grafanadata:
  alertdata:
